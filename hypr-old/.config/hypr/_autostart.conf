#################
### AUTOSTART ###
#################

exec-once = ~/.config/hypr/scripts/xdph.sh
exec-once = systemctl --user import-environment $(env | cut -d'=' -f 1) # for XDPH
exec-once = dbus-update-activation-environment --systemd --all # for XDPH
exec-once = systemctl --user start hyprpolkitagent
# exec-once = ~/.config/hypr/scripts/polkit.sh # authentication dialogue for GUI apps
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "Dracula"
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = dunst -config $HOME/.config/dunst/dunstrc
# exec-once = hyprpaper
exec-once = swaybg -i ~/Pictures/Wallpapers/wallhaven-9omr8k.png 
exec-once = waybar
