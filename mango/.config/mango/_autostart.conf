# Autostarts
exec-once=~/.config/mango/scripts/xdph.sh
exec-once=dbus-update-activation-environment --all
# exec-once=/usr/libexec/hyprpolkitagent
exec-once=gsettings set org.gnome.desktop.interface gtk-theme "Dracula"
exec-once=gsettings set org.gnome.desktop.interface cursor-theme "Adwaita"
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store
exec-once=dunst -config $HOME/.config/dunst/dunstrc
exec-once=sh -c 'pgrep -x pipewire >/dev/null || pipewire &'
    # hl.exec_cmd("hyprsunset")
exec-once=~/scripts/brightness restore
exec-once=awww-daemon
exec-once=fcitx5
exec-once=~/.config/hypr/scripts/launch-waybar.sh
exec-once=~/.config/hypr/scripts/capslock-notify.sh
exec-once=udiskie --automount --no-notify --no-tray
