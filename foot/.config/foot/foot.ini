shell=zsh
# term=xterm-256color
term=foot

# Rewritten by ~/scripts/theme: dark = Tokyo Night, light = Tokyo Dawn.
initial-color-theme = dark

title=foot

font=IosevkaTerm Nerd Font Mono:weight=medium:size=12
letter-spacing=0
# horizontal-letter-offset=0
# vertical-letter-offset=0
# underline-offset=<font metrics>
# box-drawings-uses-font-glyphs=no
dpi-aware=no

# initial-window-size-pixels=700x500  # Or,
# initial-window-size-chars=<COLSxROWS>
# initial-window-mode=windowed
pad=10x5                          # optionally append 'center'
# resize-delay-ms=100

# notify=notify-send -a ${app-id} -i ${app-id} ${title} ${body}

bold-text-in-bright=no
# word-delimiters=,│`|:"'()[]{}<>
# selection-target=primary
# workers=<number of logical CPUs>

[scrollback]
lines=10000

[url]
# launch=xdg-open ${url}
# label-letters=sadfjklewcmpgh
# osc8-underline=url-mode
# protocols=http, https, ftp, ftps, file, gemini, gopher
# uri-characters=abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_.,~:;/?#@!$&%*+="'

[cursor]
style=beam
# color=130F0F ede0de
blink=yes
beam-thickness=2
# underline-thickness=<font underline thickness>


[colors-dark]
# Tokyo Night
foreground=c0caf5
background=1a1b26

## Normal/regular colors (color palette 0-7)
regular0=24283b  # black
regular1=f7768e  # red
regular2=9ece6a  # green
regular3=e0af68  # yellow
regular4=7aa2f7  # blue
regular5=bb9af7  # magenta
regular6=7dcfff  # cyan
regular7=a9b1d6  # white

## Bright colors (color palette 8-15)
bright0=414868   # bright black
bright1=f7768e   # bright red
bright2=9ece6a   # bright green
bright3=e0af68   # bright yellow
bright4=7aa2f7   # bright blue
bright5=bb9af7   # bright magenta
bright6=7dcfff   # bright cyan
bright7=c0caf5   # bright white

## dimmed colors (see foot.ini(5) man page)
dim0=ff9e64
dim1=f7768e

[colors-light]
# Tokyo Dawn (Rose Pine Dawn)
foreground=464261
background=faf4ed

## Normal/regular colors (color palette 0-7)
regular0=f2e9e1  # black
regular1=b4637a  # red
regular2=56949f  # green
regular3=ea9d34  # yellow
regular4=286983  # blue
regular5=907aa9  # magenta
regular6=56949f  # cyan
regular7=797593  # white

## Bright colors (color palette 8-15)
bright0=dfdad9   # bright black
bright1=b4637a   # bright red
bright2=56949f   # bright green
bright3=ea9d34   # bright yellow
bright4=286983   # bright blue
bright5=907aa9   # bright magenta
bright6=56949f   # bright cyan
bright7=464261   # bright white

## dimmed colors (see foot.ini(5) man page)
dim0=d7827e
dim1=b4637a

